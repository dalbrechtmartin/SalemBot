services:
  bot:
    build: .
    container_name: salembot
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_URL=${OLLAMA_URL}
    command: python src/main.py

  db:
    image: postgres:15
    container_name: salem-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
      build: ./ollama
      container_name: ollama
      ports:
        - "11434:11434"
      volumes:
        - ollama_data:/root/.ollama
      healthcheck:
        test: >
          sh -c "
          curl -s http://localhost:11434/api/tags | grep -q '\"name\":\"llama3:latest\"'
          "
        interval: 300s
        timeout: 5s
        retries: 10
        start_period: 60s

volumes:
  pgdata:
  ollama_data: